<!DOCTYPE html>
<html>

<head>

    <title>Login - Exam Anxiety Reducer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="form-container">

    <div class="form-box">

        <h1>Welcome Back! 👋</h1>

        <p>Login to continue your exam preparation.</p>

        <form method="POST">

            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>


            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   required>


            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

    </div>

</div>

</body>

</html>

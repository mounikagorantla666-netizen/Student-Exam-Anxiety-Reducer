<!DOCTYPE html>
<html>

<head>

    <title>Test Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav>

    <h2>🧠 Exam Anxiety Reducer</h2>

    <a href="/dashboard">Dashboard</a>

</nav>


<div class="profile-container">

    <div class="profile-box">

        <div class="profile-icon">
            🎉
        </div>

        <h1>Test Completed!</h1>

        <h2>{{ subject }} - {{ topic }}</h2>

        <h1>
            {{ score }} / {{ total }}
        </h1>

        <p>
            You answered
            <strong>{{ score }}</strong>
            questions correctly out of
            <strong>{{ total }}</strong>.
        </p>

        <br>

        <a href="/practice-test"
           class="main-button">

            Take Another Test

        </a>

        <br><br>

        <a href="/dashboard">
            Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
